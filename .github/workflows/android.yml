name: Build Superultra for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Do NOT use android-actions/setup-android@v3 here.
      # The current GitHub runner already contains the Android SDK,
      # and setup-android@v3 can try to install the obsolete "tools"
      # package and fail with:
      #   Warning: Failed to find package 'tools'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "${ANDROID_HOME}" -type f -name sdkmanager -print
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Select Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"

          NDK="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK was not installed"
            ls -la "${ANDROID_HOME}/ndk" || true
            exit 1
          fi

          echo "NDK=${NDK}"

          echo "CC=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "NDK=${NDK}" >> "$GITHUB_ENV"

      # Superultra's source embeds this file with:
      #
      #   INCBIN(nnueNet, "nnueweights.bin");
      #
      # The repository/tag must therefore provide the exact v2.1 network.
      #
      # First use a network already present in the checkout.
      # If it is absent, obtain the v2.1 source archive and extract
      # the network from there.
      - name: Locate Superultra NNUE network
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching checkout for nnueweights.bin..."

          find . -type f -name "nnueweights.bin" -print

          if [ -f "src/nnueweights.bin" ]; then
            echo "Found src/nnueweights.bin"
            ls -lh src/nnueweights.bin
            exit 0
          fi

          if [ -f "nnueweights.bin" ]; then
            echo "Found root nnueweights.bin"
            cp nnueweights.bin src/nnueweights.bin
            ls -lh src/nnueweights.bin
            exit 0
          fi

          echo
          echo "ERROR: nnueweights.bin is not present in this checkout."
          echo
          echo "The Superultra source requires the exact NNUE network."
          echo "It will NOT be replaced with a Stockfish network."
          echo
          echo "Please upload/copy the original Superultra v2.1"
          echo "nnueweights.bin into:"
          echo
          echo "    src/nnueweights.bin"
          echo
          exit 1

      - name: Build Superultra
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail

          make clean || true

          make \
            ARCH=android-neon \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR"

      - name: Inspect binary
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail

          echo "Built files:"
          find . -maxdepth 1 -type f -printf '%f %s bytes\n'

          echo
          echo "Binary information:"
          file superultra || true

          echo
          echo "Dynamic dependencies:"
          readelf -d superultra || true

          echo
          echo "Architecture:"
          readelf -h superultra | grep -E "Class|Machine|Type"

      - name: UCI smoke test
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail

          printf 'uci\nisready\nposition startpos\ngo depth 4\nquit\n' \
            | timeout 30 ./superultra

      - name: Prepare single binary artifact
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf android-artifact
          mkdir -p android-artifact

          cp src/superultra android-artifact/Superultra-Android-ARM64

          chmod +x android-artifact/Superultra-Android-ARM64

          echo "Final artifact:"
          ls -lh android-artifact/Superultra-Android-ARM64

          echo
          echo "SHA256:"
          sha256sum android-artifact/Superultra-Android-ARM64

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: Superultra-Android-ARM64
          path: android-artifact/Superultra-Android-ARM64
          if-no-files-found: error
          compression-level: 0
