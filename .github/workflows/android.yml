name: Build Superultra for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_API: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "${ANDROID_HOME}" -type f -name sdkmanager -print
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Select Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          NDK="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK was not installed"
            ls -la "${ANDROID_HOME}/ndk" || true
            exit 1
          fi

          echo "NDK=${NDK}" >> "$GITHUB_ENV"

          echo "CC=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"

          echo "CXX=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"

          echo "AR=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Verify NNUE network
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "src/nnueweights.bin" ]; then
            echo "ERROR: src/nnueweights.bin was not found."
            echo "Your fork should contain the original Superultra NNUE network."
            exit 1
          fi

          ls -lh src/nnueweights.bin

      - name: Build Superultra
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail

          make clean || true

          make \
            ARCH=android-neon \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR"

          echo
          echo "Build directory:"
          ls -lah

      - name: Locate built binary
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail

          BINARY="./Superultra-2.1"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Superultra binary was not created."

            echo
            echo "Possible executable files:"
            find . -maxdepth 1 -type f -perm -111 -print || true

            echo
            echo "All files:"
            ls -lah

            exit 1
          fi

          chmod +x "$BINARY"

          echo
          echo "Binary information:"
          file "$BINARY"

          echo
          echo "ELF architecture:"
          readelf -h "$BINARY" | grep -E "Class|Machine|Type"

          echo
          echo "Dynamic dependencies:"
          readelf -d "$BINARY" || true

          echo
          echo "Binary size:"
          ls -lh "$BINARY"

      - name: UCI smoke test
        shell: bash
        working-directory: src
        run: |
          set -euxo pipefail

          BINARY="./Superultra-2.1"

          printf 'uci\nisready\nposition startpos\ngo depth 4\nquit\n' \
            | timeout 30 "$BINARY"

      - name: Prepare single binary artifact
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf android-artifact
          mkdir -p android-artifact

          cp "src/Superultra-2.1" \
             "android-artifact/Superultra-Android-ARM64"

          chmod +x \
            "android-artifact/Superultra-Android-ARM64"

          echo "Final artifact:"
          ls -lh android-artifact/Superultra-Android-ARM64

          echo
          echo "SHA256:"
          sha256sum android-artifact/Superultra-Android-ARM64

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: Superultra-Android-ARM64
          path: android-artifact/Superultra-Android-ARM64
          if-no-files-found: error
          compression-level: 0
